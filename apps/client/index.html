<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Doomscrolls</title>
    <style>
      html,
      body,
      #doomscrolls-game {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #090706;
        /* Core 0.1 -- reserve notch/status-bar space in native shells (Capacitor
           iOS/Android) and modern mobile browsers; falls back to 0px on desktop. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }

      /* Core 0.1 -- only the Phaser canvas opts out of native touch gestures
         (pinch-zoom/pull-to-refresh/double-tap-zoom) so drag-to-move and taps
         land reliably on mobile; DOM overlay panels (appended as siblings of
         this element on document.body) keep normal scroll/select behavior. */
      #doomscrolls-game {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="doomscrolls-game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
